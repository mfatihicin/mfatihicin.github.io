<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://zdbcfqgybkyvhmanqqvy.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1120">
<title>MasaPlay — Masaya davet</title>
<meta property="og:title" content="MasaPlay — Masama gel!">
<meta property="og:description" content="Tavla, Okey, 101, Batak, Pişti — arkadaşlarınla aynı masada.">
<style>
  :root{--bg:#0b1120;--card:#141c30;--ink:#fff;--muted:rgba(255,255,255,.68);--gold:#f0c34a;--blue:#3a6df0;--line:rgba(255,255,255,.14)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,#1d2b52 0%,var(--bg) 60%)}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .logo{font-weight:900;font-size:15px;letter-spacing:3px;color:var(--gold)}
  .dice{font-size:46px;margin:6px 0 2px}
  h1{font-size:22px;line-height:1.25;margin:10px 0 8px}
  p{color:var(--muted);margin:0 0 18px;font-size:15px}
  .code{display:inline-block;font-weight:900;font-size:30px;letter-spacing:6px;color:var(--gold);background:rgba(240,195,74,.1);border:1px dashed rgba(240,195,74,.5);border-radius:14px;padding:8px 16px;margin:0 0 4px;font-variant-numeric:tabular-nums}
  .btn{display:block;text-decoration:none;font-weight:800;border-radius:16px;padding:15px 16px;margin:12px 0 0;font-size:17px}
  .primary{background:var(--blue);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
  .ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);font-size:15px}
  .row{display:flex;gap:10px}.row .btn{flex:1}
  .link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
  .hidden{display:none}
  #hint{color:var(--muted);font-size:13px;margin-top:14px}
  small{display:block;color:rgba(255,255,255,.4);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">MASAPLAY</div>
  <div class="dice" aria-hidden="true">🎲</div>
  <h1 id="title">Masaya davetlisin</h1>
  <p id="sub">Uygulamada aç, direkt masaya otur.</p>
  <div id="codeBox" class="hidden">
    <div id="code" class="code" aria-label="Oda kodu"></div><br>
    <button id="copy" class="link hidden" type="button">Kodu kopyala</button>
  </div>
  <a id="open" class="btn primary hidden" href="#">Uygulamada aç</a>
  <div id="hint" class="hidden">Uygulama açılmadı mı? Önce MasaPlay'i indir, sonra bu linke tekrar dokun ya da uygulamada “Katıl”a oda kodunu yaz.</div>
  <div class="row">
    <a class="btn ghost" href="https://apps.apple.com/app/id6794448129" rel="noopener noreferrer">App Store</a>
    <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.mfatihicin.masaplay" rel="noopener noreferrer">Google Play</a>
  </div>
  <small>Tavla · Okey · 101 · Batak · Pişti — arkadaşlarınla aynı masada.</small>
</main>
<script src="join.js"></script>
</body>
</html>
