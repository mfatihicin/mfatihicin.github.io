<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kredi Hesaplama — mfatihicin.com</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="https://mfatihicin.com/araclar/kredi-hesaplama.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=10">
<style>body{background:transparent}.emb{padding:14px}.emb-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}.emb .tool{margin:0}</style></head>
<body><div class="emb"><div class="tool"><div class="card"><div class="inline"><div><label for="p">Kredi tutarı (₺)</label><input type="number" id="p" value="100000" min="0"></div><div><label for="i">Aylık faiz (%)</label><input type="number" id="i" value="3.5" step="0.01" min="0"></div><div><label for="n">Vade (ay)</label><input type="number" id="n" value="24" min="1" max="360"></div></div>
<div class="row" style="margin-top:10px"><label><input type="checkbox" id="tax" checked> Vergi ekle (BSMV + KKDF)</label><input type="number" id="tr" value="30" step="1" min="0" style="width:90px" aria-label="Toplam vergi oranı"><span class="muted">% (faiz üzerinden)</span></div>
<dl class="kv" style="margin-top:18px;font-size:18px"><dt>Aylık taksit</dt><dd id="m" style="color:var(--accent);font-weight:700"></dd><dt>Toplam geri ödeme</dt><dd id="t"></dd><dt>Toplam faiz + vergi</dt><dd id="c"></dd></dl></div>
<details><summary>Ay ay ödeme planı</summary><div class="overflow"><table id="plan"></table></div></details></div><div class="emb-f"><span>Kredi Hesaplama</span><a href="https://mfatihicin.com/araclar/kredi-hesaplama.html" target="_blank" rel="noopener">mfatihicin.com ile çalışır</a></div></div>
<script src="/assets/site.js?v=8"></script><script>window.addEventListener('DOMContentLoaded',()=>{
const $=id=>document.getElementById(id);const f=n=>n.toLocaleString('tr-TR',{style:'currency',currency:'TRY'});
function calc(){const P=+$('p').value||0,n=Math.max(1,+$('n').value|0);let r=(+$('i').value||0)/100;if($('tax').checked)r=r*(1+(+$('tr').value||0)/100);
 const m=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;$('m').textContent=f(m);$('t').textContent=f(m*n);$('c').textContent=f(m*n-P);
 let b=P,rows='<tr><th>Ay</th><th>Taksit</th><th>Faiz+vergi</th><th>Anapara</th><th>Kalan</th></tr>';for(let k=1;k<=n;k++){const it=b*r,pr=m-it;b=Math.max(0,b-pr);rows+=`<tr><td>${k}</td><td>${f(m)}</td><td>${f(it)}</td><td>${f(pr)}</td><td>${f(b)}</td></tr>`}$('plan').innerHTML=rows}
['p','i','n','tax','tr'].forEach(i=>$(i).oninput=calc);calc();
});</script></body></html>
