<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kıdem ve İhbar Tazminatı Hesaplama — mfatihicin.com</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="https://mfatihicin.com/araclar/kidem-tazminati-hesaplama.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=10">
<style>body{background:transparent}.emb{padding:14px}.emb-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}.emb .tool{margin:0}</style></head>
<body><div class="emb"><div class="tool"><div class="inline"><div><label for="s">İşe giriş tarihi</label><input type="text" id="s" placeholder="GG.AA.YYYY" value="01.03.2019"></div><div><label for="e">İşten çıkış tarihi</label><input type="text" id="e" placeholder="GG.AA.YYYY"></div></div>
<div class="inline"><div><label for="w">Giydirilmiş brüt aylık ücret (₺)</label><input type="number" id="w" value="60000" min="0"></div><div><label for="cap">Kıdem tavanı (₺)</label><input type="number" id="cap" step="0.01"></div><div><label for="tr">İhbar için gelir vergisi oranı</label><select id="tr"><option value=".15">%15</option><option value=".20" selected>%20</option><option value=".27">%27</option><option value=".35">%35</option><option value=".40">%40</option></select></div></div>
<dl class="kv" style="margin-top:18px;font-size:17px"><dt>Çalışma süresi</dt><dd id="dur"></dd><dt>Kıdem tazminatı (brüt)</dt><dd id="kb"></dd><dt>Damga vergisi</dt><dd id="kd"></dd><dt>Kıdem tazminatı (net)</dt><dd id="kn" style="color:var(--accent);font-weight:700"></dd><dt>İhbar süresi</dt><dd id="is"></dd><dt>İhbar tazminatı (brüt)</dt><dd id="ib"></dd><dt>İhbar tazminatı (net, yaklaşık)</dt><dd id="in"></dd></dl></div><div class="emb-f"><span>Kıdem ve İhbar Tazminatı Hesaplama</span><a href="https://mfatihicin.com/araclar/kidem-tazminati-hesaplama.html" target="_blank" rel="noopener">mfatihicin.com ile çalışır</a></div></div>
<script src="/assets/site.js?v=9"></script><script>window.addEventListener('DOMContentLoaded',()=>{
const $=id=>document.getElementById(id);const f=n=>n.toLocaleString('tr-TR',{style:'currency',currency:'TRY'});
const pd=s=>{const m=(s||'').trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);return m?new Date(+m[3],m[2]-1,+m[1]):null};
const t=new Date();$('e').value=String(t.getDate()).padStart(2,'0')+'.'+String(t.getMonth()+1).padStart(2,'0')+'.'+t.getFullYear();
function capFor(d){if(!d)return 73729.87;if(d>=new Date(2026,6,1))return 73729.87;if(d>=new Date(2026,0,1))return 64948.77;return null}
let userCap=false;$('cap').oninput=()=>{userCap=true;calc()};
function calc(){const s=pd($('s').value),e=pd($('e').value),w=+$('w').value||0;if(!s||!e||e<=s){$('dur').textContent='Tarihleri GG.AA.YYYY biçiminde gir';return}
 if(!userCap){const c=capFor(e);$('cap').value=c||'';$('cap').placeholder=c?'':'Bu dönemin tavanını gir'}
 const cap=+$('cap').value||Infinity;const days=Math.round((e-s)/864e5)+1;const y=Math.floor(days/365),rem=days%365;
 $('dur').textContent=`${y} yıl ${Math.floor(rem/30)} ay ${rem%30} gün (${days} gün)`;
 const base=Math.min(w,cap);const kb=days>=365?base*days/365:0;const kd=kb*.00759;
 $('kb').textContent=days>=365?f(kb):'Hak kazanılmadı (1 yıldan az)';$('kd').textContent=f(kd);$('kn').textContent=f(kb-kd);
 const mo=days/30.42;const wk=mo<6?2:mo<18?4:mo<36?6:8;$('is').textContent=wk+' hafta ('+wk*7+' gün)';
 const ib=w/30*wk*7;$('ib').textContent=f(ib);$('in').textContent=f(ib-ib*+$('tr').value-ib*.00759)}
['s','e','w','tr'].forEach(i=>$(i).oninput=calc);calc();
});</script></body></html>
