<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>İki Tarih Arası Gün Hesaplama ve Geri Sayım — mfatihicin.com</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="https://mfatihicin.com/araclar/iki-tarih-arasi-gun-hesaplama.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=8">
<style>body{background:transparent}.emb{padding:14px}.emb-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}.emb .tool{margin:0}</style></head>
<body><div class="emb"><div class="tool"><script>window.S={"a": "Başlangıç", "b": "Bitiş", "days": "gün", "weeks": "hafta", "months": "ay (yaklaşık)", "left": "Kalan süre", "passed": "Bu tarih geçti", "d": "g", "h": "sa", "m": "dk", "sec": "sn"};</script><div class="inline"><div><label for="d_a">Başlangıç</label><input type="date" id="d_a"></div><div><label for="d_b">Bitiş</label><input type="date" id="d_b"></div></div>
<p class="big" id="d_r" style="margin-top:16px"></p><p class="muted" id="d_r2"></p><p class="muted" style="margin-top:18px">Kalan süre</p><p class="big" style="font-size:30px" id="d_c"></p></div><div class="emb-f"><span>İki Tarih Arası Gün Hesaplama ve Geri Sayım</span><a href="https://mfatihicin.com/araclar/iki-tarih-arasi-gun-hesaplama.html" target="_blank" rel="noopener">mfatihicin.com ile çalışır</a></div></div>
<script src="/assets/site.js?v=7"></script><script>window.addEventListener('DOMContentLoaded',()=>{const $=i=>document.getElementById(i);const iso=d=>d.toISOString().slice(0,10);
function go(){const a=new Date($('d_a').value),b=new Date($('d_b').value);if(isNaN(a)||isNaN(b))return;const d=Math.round((b-a)/864e5);$('d_r').textContent=d.toLocaleString()+' '+S.days;$('d_r2').textContent=(d/7).toFixed(1)+' '+S.weeks+' · '+(d/30.4375).toFixed(1)+' '+S.months}
function tick(){const b=new Date($('d_b').value+'T00:00:00');let s=Math.floor((b-new Date())/1000);if(isNaN(s))return;if(s<0){$('d_c').textContent=S.passed;return}const D=Math.floor(s/86400);s%=86400;$('d_c').textContent=`${D}${S.d} ${Math.floor(s/3600)}${S.h} ${Math.floor(s%3600/60)}${S.m} ${s%60}${S.sec}`}
const t=new Date();$('d_a').value=iso(t);$('d_b').value=t.getFullYear()+1+'-01-01';$('d_a').oninput=go;$('d_b').oninput=()=>{go();tick()};go();tick();setInterval(tick,1000);});</script></body></html>
