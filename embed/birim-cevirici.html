<script src="/assets/site.js?v=8"></script><script>window.addEventListener('DOMContentLoaded',()=>{const U={len:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254},wt:{kg:1,g:.001,t:1000,lb:.45359237,oz:.028349523},vol:{L:1,mL:.001,'m³':1000,'gal (US)':3.785411784,'qt (US)':.946352946,'cup (US)':.2365882365,'fl oz (US)':.0295735296},spd:{'km/h':1,'m/s':3.6,mph:1.609344,knot:1.852},area:{'m²':1,'km²':1e6,ha:1e4,'dönüm':1000,acre:4046.8564224,'ft²':.09290304},temp:{'°C':0,'°F':0,K:0}};const $=i=>document.getElementById(i);const fm=x=>(+x.toPrecision(8)).toLocaleString(document.documentElement.lang,{maximumFractionDigits:6});
